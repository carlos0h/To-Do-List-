
<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name = "description" content= "Apenas um To-Do list simples para organizar suas tarefas!" >
        <title>Meu To-Do List</title>

        <link rel= "stylesheet" href="style.css">
       
    </head>
    <body>
            <header> 
                <h1> To-Do List</h1>
                <p> <b> Alinhe sua rotina para melhor organização!</b> </p>
            </header>
            <main>

           <section>   
                <h2> Adicionar nova tarefa </h2>
                    <form> 
                        <label for="inputTarefa">Nova tarefa:</label>

                    
                    <input 
                    id="inputTarefa"
                    name="tarefa"
                    type = "text"
                    placeholder="Digite uma tarefa..."
                    required>
                    
                    <button id="btnAdicionar" type="submit"> 
                    Adicionar 
                    </button>
                </form>
                
                <ul id="listaTarefas"> 
                    <li>
                        <button class="check">✓</button>
                        <span>Estudar HTML</span>
                    </li>

                    <li class="concluida"> 
                        <button class="check">✓</button>
                        <span> Estudar CSS </span>
                    </li>
                    <li>
                        <button class="check">✓</button>
                        <span> Estudar Java Script</span>
                    </li>
                </ul>
            </section>

                  
            </main>
            <footer> <p> Projeto desenvolvido a fim de aprendizado!</p>  </footer>

         <script src="script.js"></script>
    </body>
















</html>
