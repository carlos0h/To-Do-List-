
<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name = "description" content= "Apenas um To-Do list simples para organizar suas tarefas!" >
        <title>Meu To-Do List</title>

        <link rel= "stylesheet" href="style.css">
       
    </head>
    <body>
            <header> 
                <h1> To-Do List</h1>
                <p> <b> Alinhe sua rotina para melhor organização!</b> </p>
            </header>
            <main>

           <section>   
                <h2> Adicionar nova tarefa </h2>

                <p id="contador">0 tarefas pendentes</p>
                    <form> 
                        <label for="inputTarefa">Nova tarefa:</label>

                    
                    <input 
                    id="inputTarefa"
                    name="tarefa"
                    type = "text"
                    placeholder="Digite uma tarefa..."
                    required>
                    <label for="selectCategoria">Categoria:</label>
                    <label for="inputPrazo">Prazo (opcional):</label>
                    <input type="date" id="inputPrazo">
                    <select id="selectCategoria">
                        <option value="trabalho">Trabalho</option>
                        <option value="estudo">Estudo</option>
                        <option value="pessoal">Pessoal</option>
                    </select>
                    <button id="btnAdicionar" type="submit"> 
                    Adicionar 
                    </button>
                </form>
                <div id="filtros">
                    <button class="btnFiltro ativo" data-filtro="todas">Todas</button>
                    <button class="btnFiltro" data-filtro="pendentes">Pendentes</button>
                    <button class="btnFiltro" data-filtro="concluidas">Concluídas</button>

                </div>
                <ul id="listaTarefas"> 
                </ul>
                <p id="listaVazia">Nenhuma tarefa por aqui!</p>
            </section>

                  
            </main>
            <footer> <p> Projeto desenvolvido a fim de aprendizado!</p>  </footer>

         <script src="script.js"></script>
    </body>
















</html>
